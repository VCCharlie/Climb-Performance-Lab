<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8eaed" />
    <script>
      (function initThemeClass() {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var accent = localStorage.getItem('accentPalette');
          if (accent === 'alpine' || accent === 'indigo' || accent === 'plum') {
            document.documentElement.setAttribute('data-accent-palette', accent);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <meta name="description" content="Cycling performance analysis for climbers — power, pacing, and training insights." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Climb Lab Pro" />
    <!-- Sentinel Phase 3.2: enforcing CSP — includes Google Sign-In / Firebase Auth hosts -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://apis.google.com https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.google-analytics.com https://*.firebaseio.com https://intervals.icu https://www.strava.com https://api.openweathermap.org https://api.open-meteo.com https://geocoding-api.open-meteo.com https://europe-west1-climb-performance-lab.cloudfunctions.net https://*.europe-west1.run.app https://overpass-api.de; frame-src 'self' https://accounts.google.com https://www.google.com https://*.google.com https://*.firebaseapp.com; worker-src 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com"
    />
    <title>Climb Lab Pro</title>
    <!-- Google Fonts: Barlow & Barlow Condensed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              /* Legacy aliases — map to CSS variables for dark-mode parity */
              cdbg: 'var(--cd-bg)',
              cdsurface: 'var(--cd-surface-legacy)',
              cdborder: 'var(--cd-border)',
              /* Text/borders: emphasis orange; fills use cdprimary */
              cdaccent: 'rgb(var(--cd-accent-emphasis-rgb) / <alpha-value>)',
              cdtext: 'var(--cd-text)',
              cdmuted: 'var(--cd-muted)',
              cdblue: 'var(--cd-blue)',
              cdgreen: 'var(--cd-green)',
              cdred: 'var(--cd-red)',
              /* MD3 surface ladder */
              cdsurfacedim: 'var(--cd-surface-dim)',
              cdsurfacemid: 'var(--cd-surface)',
              cdsurfacebright: 'var(--cd-surface-bright)',
              cdsurfacelow: 'var(--cd-surface-container-low)',
              cdsurfacehigh: 'var(--cd-surface-container-high)',
              /* MD3 primary roles */
              cdprimary: 'rgb(var(--cd-primary-rgb) / <alpha-value>)',
              cdprimaryhover: 'var(--cd-primary-hover)',
              cdprimaryactive: 'var(--cd-primary-active)',
              cdonprimary: 'var(--cd-on-primary)',
              cdprimarycontainer: 'var(--cd-primary-container)',
              cdonprimarycontainer: 'var(--cd-on-primary-container)',
              cdaccentsoft: 'var(--cd-accent-soft)',
              cdaccentemphasis: 'var(--cd-accent-emphasis)',
              /* Brand secondary */
              cdbrand: 'var(--cd-brand)',
              cdonbrand: 'var(--cd-on-brand)',
              /* Overlays */
              cdscrim: 'var(--cd-scrim)'
            },
            borderRadius: {
              cdsm: 'var(--cd-radius-sm)',
              cdmd: 'var(--cd-radius-md)',
              cdlg: 'var(--cd-radius-lg)',
              cdxl: 'var(--cd-radius-xl)'
            },
            transitionTimingFunction: {
              emphasized: 'var(--cd-ease-emphasized)'
            },
            transitionDuration: {
              short: 'var(--cd-duration-short)',
              medium: 'var(--cd-duration-medium)',
              long: 'var(--cd-duration-long)'
            },
            fontFamily: {
              sans: ['Barlow', 'sans-serif'],
              head: ['"Barlow Condensed"', 'sans-serif']
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-cdbg text-cdtext font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
