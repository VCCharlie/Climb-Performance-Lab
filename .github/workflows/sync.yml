name: Sync to Synology
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted  # Dit dwingt de actie naar jouw NAS
    steps:
      - name: Copy files to Web folder
        run: |
          # Omdat we de webmap hebben gekoppeld aan /data:
          cp -R . /data/
          echo "Sync voltooid op $(date)"