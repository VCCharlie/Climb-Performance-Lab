# Sentinel Phase 4.2 — deploy sync-intervals without local gcloud CLI.
# Owner: GitHub → Actions → "Deploy Cloud Function" → Run workflow → type DEPLOY.
name: Deploy Cloud Function

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish cloud-function/ to Cloud Run (sync-intervals)'
        required: true
        type: string

env:
  GCP_PROJECT: climb-performance-lab
  GCP_REGION: europe-west1
  FUNCTION_NAME: sync-intervals

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Prefer a deploy-only key (Cloud Run + Cloud Build IAM). Falls back to FIREBASE_SERVICE_ACCOUNT.
          credentials_json: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Verify Cloud Run deploy access
        run: |
          SA="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Authenticated as: ${SA}"
          if [ -n "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}" ]; then
            echo "Using GitHub secret: GCP_DEPLOY_SERVICE_ACCOUNT"
          else
            echo "::warning::Using FIREBASE_SERVICE_ACCOUNT for deploy — it needs extra IAM (roles/run.developer, roles/cloudbuild.builds.editor). See docs/CLOUD_FUNCTION_AUTH.md Option C."
          fi
          if ! gcloud run services describe "${{ env.FUNCTION_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --format='value(metadata.name)' >/dev/null 2>&1; then
            echo ""
            echo "::error::Permission denied (run.services.get) or service missing for ${SA}."
            echo "Fix (pick one):"
            echo "  1) Cloud Shell deploy (no IAM change): https://shell.cloud.google.com/?project=climb-performance-lab — docs/CLOUD_FUNCTION_AUTH.md Option A"
            echo "  2) GCP IAM: add roles/run.developer + roles/cloudbuild.builds.editor to ${SA}"
            echo "  3) Create github-cloud-run-deploy SA, add JSON as GitHub secret GCP_DEPLOY_SERVICE_ACCOUNT"
            exit 1
          fi
          echo "Cloud Run access OK — starting deploy."

      - name: Deploy sync-intervals (Cloud Run — code only)
        run: |
          # Redeploy source only. Do not pass --set-secrets or --update-env-vars —
          # existing Intervals credentials and AUTOMATION_SHARED_SECRET stay as configured.
          if ! gcloud run deploy "${{ env.FUNCTION_NAME }}" \
            --source cloud-function \
            --function sync_intervals \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --allow-unauthenticated; then
            echo ""
            echo "::error::Deploy failed after permission check. Common causes:"
            echo "  - roles/cloudbuild.builds.editor missing (source build)"
            echo "  - roles/iam.serviceAccountUser on the Cloud Run runtime service account"
            echo "  - Cloud Build API disabled"
            echo "Easiest fix — Google Cloud Shell:"
            echo "  https://shell.cloud.google.com/?project=climb-performance-lab"
            echo "  See docs/CLOUD_FUNCTION_AUTH.md Option A"
            exit 1
          fi

      - name: Print service URL
        run: |
          gcloud run services describe "${{ env.FUNCTION_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --format='value(status.url)'

  confirm-guard:
    if: github.event.inputs.confirm != 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Abort — confirmation required
        run: |
          echo "Workflow aborted: you must type DEPLOY in the confirm field."
          exit 1
