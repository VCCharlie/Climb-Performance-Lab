name: Nightly Intervals Sync

on:
  # Scheduled via external cron (e.g. cron-job.org) POST → workflow_dispatch.
  # GitHub's built-in `schedule` cron is not used (unreliable start time on shared runners).
  workflow_dispatch:

jobs:
  sync-to-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate nightly sync (ESM + Node/Vite compat)
        run: npm run test:nightly-sync

      - name: Install Firebase Admin
        # Installed here only — intentionally NOT in package.json to keep the
        # front-end bundle free of server-side dependencies.
        run: npm install firebase-admin

      - name: Run Nightly Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          AUTOMATION_SHARED_SECRET: ${{ secrets.AUTOMATION_SHARED_SECRET }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: node scripts/nightlySync.js
