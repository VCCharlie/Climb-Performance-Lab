# Sentinel Phase 4.1 — deploy Firestore rules without local Firebase CLI.
# Owner: GitHub → Actions → "Deploy Firestore Rules" → Run workflow → type DEPLOY.
name: Deploy Firestore Rules

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish firestore.rules to production'
        required: true
        type: string

jobs:
  deploy-rules:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java 21 (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests (emulator)
        run: npm run test:rules

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules (Rules API)
        run: node scripts/deployFirestoreRules.js

  confirm-guard:
    if: github.event.inputs.confirm != 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Abort — confirmation required
        run: |
          echo "Workflow aborted: you must type DEPLOY in the confirm field."
          exit 1
