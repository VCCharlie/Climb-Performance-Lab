name: Deploy Vite App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-flight Pages deploy — cancellation can leave the Pages
# deployment lock wedged and cause "Deployment failed, try again later."
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip_deploy: ${{ steps.stale.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # When two main pushes deploy back-to-back, an older workflow can finish last and
      # overwrite GitHub Pages with stale assets (e.g. #348 deploy after #349).
      - name: Skip stale commit (newer main exists)
        id: stale
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build/deploy for ${{ github.sha }}; tip is $(git rev-parse origin/main)"
          fi
      - name: Set up Node
        if: steps.stale.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.stale.outputs.skip != 'true'
        run: npm ci
      - name: Build
        if: steps.stale.outputs.skip != 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          VITE_STRAVA_OAUTH_URL: ${{ secrets.VITE_STRAVA_OAUTH_URL }}
        run: npm run build
      - name: Upload artifact
        if: steps.stale.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.build.outputs.skip_deploy != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # Re-check tip of main before touching the Pages queue. Build may have started
      # when this commit was HEAD, but several merges can land before deploy runs.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Skip deploy if superseded on main
        id: stale_deploy
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deploy for ${{ github.sha }}; main is now $(git rev-parse origin/main)"
          fi
      # GitHub Pages allows only one deployment in flight per site. A prior deploy
      # may still be settling when this job starts — retry once after a short wait.
      - name: Deploy to GitHub Pages
        if: steps.stale_deploy.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for in-flight deployment to settle
        if: steps.stale_deploy.outputs.skip != 'true' && steps.deployment.outcome == 'failure'
        run: sleep 90
      - name: Deploy to GitHub Pages (retry)
        if: steps.stale_deploy.outputs.skip != 'true' && steps.deployment.outcome == 'failure'
        id: deployment-retry
        uses: actions/deploy-pages@v4
      - name: Fail if both deploy attempts failed
        if: steps.stale_deploy.outputs.skip != 'true' && steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: |
          echo "GitHub Pages deployment failed twice. Re-run the workflow or check https://www.githubstatus.com/"
          exit 1
